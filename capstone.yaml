run: docker compose up -d && pip install -r requirements.txt --break-system-packages && uvicorn app.main:app --host 0.0.0.0 --port 8000
seed: python scripts/seed.py
test: pytest tests/ -v && curl -s http://localhost:8000/widget.js -o /tmp/widget.js && node tests/js/test_targeting.js /tmp/widget.js
base_url: http://localhost:8000
endpoints:
  - GET  /health
  - POST /api/widgets
  - GET  /api/widgets
  - GET  /api/widgets/{id}
  - PATCH /api/widgets/{id}
  - DELETE /api/widgets/{id}
  - GET  /widgets/{id}/config
  - GET  /widget.js
  - OPTIONS /submissions
  - POST /submissions
  - GET  /api/dashboard/widgets/{id}/submissions
  - GET  /api/dashboard/widgets/{id}/stats
  - GET  /api/dashboard/stats/geo
